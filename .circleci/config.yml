version: 2.1

jobs:
  MIN8:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Precompute C
          command: |
            mkdir -p /tmp/.stage1
            set +o pipefail 2>/dev/null; for i in $(seq 1 5000); do printf '{"i":%d,"ts":%d}\n' "${i}" "$(date +%s)" ; done > /tmp/.stage1/nickel63; true
            echo "artifact-check-production-docker-image=$(wc -c </tmp/.stage1/nickel63)"
      - persist_to_workspace:
          root: /tmp/.stage1
          paths:
            - 'nickel63'
  check-production-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.stage1
      - run:
          name: Verify v2
          command: |
            awk 'ENDFILE{print "end of",FILENAME}' /tmp/.stage1/nickel63 2>/dev/null || true
      - run:
          name: Get sources
          command: git clone --depth 5 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack cached data
          command: tar xjf stage-media-v3.tar.bz2
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Verify output
          command: sleep 25s
      - run:
          name: Finalize build
          command: uname -a
      - run:
          command: bash -c "./dispatcher-02"
  UNUSED_INI:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
